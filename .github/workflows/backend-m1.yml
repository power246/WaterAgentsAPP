name: Backend M1-M2

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Start PostgreSQL 17
        uses: ikalnytskyi/action-setup-postgres@v8
        with:
          postgres-version: "17"
          username: wateragents
          password: wateragents-ci-password
          database: wateragents_m2
          port: "5432"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install backend
        run: uv sync --project backend --extra dev --locked
      - name: Run complete test suite
        env:
          WATERAGENTS_TEST_POSTGRES_HOST: 127.0.0.1
          WATERAGENTS_TEST_POSTGRES_PORT: "5432"
          WATERAGENTS_TEST_POSTGRES_DB: wateragents_m2
          WATERAGENTS_TEST_POSTGRES_USER: wateragents
          WATERAGENTS_TEST_POSTGRES_PASSWORD: wateragents-ci-password
        run: uv run --project backend --locked python -m pytest backend/tests -q
      - name: Run Uvicorn health smoke test
        env:
          HTTP_PROXY: http://127.0.0.1:1
          HTTPS_PROXY: http://127.0.0.1:1
          ALL_PROXY: http://127.0.0.1:1
          NO_PROXY: ""
        run: uv run --project backend --locked python backend/scripts/health_smoke.py
      - name: Run Uvicorn run and SSE smoke test
        env:
          HTTP_PROXY: http://127.0.0.1:1
          HTTPS_PROXY: http://127.0.0.1:1
          ALL_PROXY: http://127.0.0.1:1
          NO_PROXY: ""
        run: uv run --project backend --locked python backend/scripts/run_sse_smoke.py
