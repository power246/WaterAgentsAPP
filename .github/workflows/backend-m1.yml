name: Backend M1

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install -e "./backend[dev]"
      - name: Run complete test suite
        run: python -m pytest backend/tests -q
      - name: Run Uvicorn health smoke test
        env:
          HTTP_PROXY: http://127.0.0.1:1
          HTTPS_PROXY: http://127.0.0.1:1
          ALL_PROXY: http://127.0.0.1:1
          NO_PROXY: ""
        run: python backend/scripts/health_smoke.py
