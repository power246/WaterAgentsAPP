name: Backend M1-M9

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      WATERAGENTS_DB_HOST: 127.0.0.1
      WATERAGENTS_DB_PORT: "5432"
      WATERAGENTS_DB_NAME: wateragents_business_guard
      WATERAGENTS_DB_USER: wateragents
      WATERAGENTS_DB_PASSWORD: wateragents-ci-password
      WATERAGENTS_DB_SSLMODE: disable
      WATERAGENTS_TEST_DB_NAME: wateragents_m9
      WATERAGENTS_MODEL_CATALOG: '[{"provider":"ci","model":"parser","roles":["query_parser"]},{"provider":"ci","model":"waterbody","roles":["waterbody"],"context_window_tokens":128000,"max_output_tokens":32768},{"provider":"ci","model":"embedding","roles":["embedding"],"embedding_profile":{"provider":"ci","model":"embedding","output_dimensions":8,"max_input_tokens":512,"distance_metric":"cosine","semantic_min_similarity":0.78,"canonical_query_schema_version":1,"canonical_template_version":1,"projection_schema_version":1}}]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Start PostgreSQL 17
        uses: ikalnytskyi/action-setup-postgres@v8
        with:
          postgres-version: "17"
          username: wateragents
          password: wateragents-ci-password
          database: wateragents_m9
          port: "5432"
      - name: Install pgvector on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-17-pgvector
      - name: Install pgvector on macOS
        if: runner.os == 'macOS'
        run: brew install pgvector
      - name: Install pgvector on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          set "PGROOT=C:\Program Files\PostgreSQL\17"
          cd /d %RUNNER_TEMP%
          git clone --branch v0.8.7 --depth 1 https://github.com/pgvector/pgvector.git
          cd pgvector
          nmake /NOLOGO /F Makefile.win
          nmake /NOLOGO /F Makefile.win install
      - name: Verify pgvector availability
        env:
          PGPASSWORD: wateragents-ci-password
        run: |
          psql --host=127.0.0.1 --port=5432 --username=wateragents --dbname=wateragents_m9 --set=ON_ERROR_STOP=1 --command="CREATE EXTENSION IF NOT EXISTS vector WITH SCHEMA public"
          psql --host=127.0.0.1 --port=5432 --username=wateragents --dbname=wateragents_m9 --set=ON_ERROR_STOP=1 --command="SELECT extversion FROM pg_extension WHERE extname = 'vector'"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install backend
        run: uv sync --project backend --extra dev --locked
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build production frontend for backend smoke tests
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
      - name: Run complete test suite
        run: uv run --project backend --locked python -m pytest backend/tests -q
      - name: Run offline M4 contract audit
        run: uv run --project backend --locked python backend/scripts/audit_parameter_capabilities.py
      - name: Run in-memory run SSE, M4, and M7 workflow smoke tests
        env:
          HTTP_PROXY: http://127.0.0.1:1
          HTTPS_PROXY: http://127.0.0.1:1
          ALL_PROXY: http://127.0.0.1:1
          NO_PROXY: ""
        run: |
          uv run --project backend --locked python backend/scripts/run_sse_smoke.py
          uv run --project backend --locked python backend/scripts/m4_workflow_smoke.py
          uv run --project backend --locked python backend/scripts/m7_topology_workflow_smoke.py
      - name: Run Uvicorn health smoke test
        env:
          HTTP_PROXY: http://127.0.0.1:1
          HTTPS_PROXY: http://127.0.0.1:1
          ALL_PROXY: http://127.0.0.1:1
          NO_PROXY: ""
        run: uv run --project backend --locked python backend/scripts/health_smoke.py
      - name: Run Uvicorn run, SSE, restart, and history smoke test
        env:
          HTTP_PROXY: http://127.0.0.1:1
          HTTPS_PROXY: http://127.0.0.1:1
          ALL_PROXY: http://127.0.0.1:1
          NO_PROXY: ""
        run: uv run --project backend --locked python backend/scripts/run_history_smoke.py
